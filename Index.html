
<!DOCTYPE html>
<html lang="pt-BR">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
<meta name="theme-color" content="#030507">
<title>PAINEL NUNEZ | FLOATING MOD</title>

<style>
:root {
  --green: #00ff88;
  --green-glow: rgba(0,255,136,.4);
  --bg: #030507;
  --panel: rgba(5, 15, 12, 0.96);
  --border: #174c35;
}

* {
  box-sizing: border-box;
  -webkit-tap-highlight-color: transparent;
}

body {
  margin: 0;
  background: var(--bg);
  color: #eafff4;
  font-family: 'Segoe UI', Arial, sans-serif;
  overflow: hidden;
  touch-action: manipulation;
}

#matrix {
  position: fixed;
  inset: 0;
  width: 100%;
  height: 100%;
  opacity: .15;
  z-index: -1;
}

/* ÍCONE FLUTUANTE */
#floating-icon {
  position: fixed;
  top: 30px;
  left: 20px;
  width: 52px;
  height: 52px;
  background: #061f14;
  border: 2px solid var(--green);
  border-radius: 50%;
  display: flex;
  align-items: center;
  justify-content: center;
  color: var(--green);
  font-weight: 900;
  font-size: 16px;
  box-shadow: 0 0 15px var(--green-glow);
  cursor: pointer;
  z-index: 9999;
  user-select: none;
  animation: pulseIcon 2s infinite;
}

@keyframes pulseIcon {
  0% { box-shadow: 0 0 0 0 rgba(0,255,136, 0.4); }
  70% { box-shadow: 0 0 0 12px rgba(0,255,136, 0); }
  100% { box-shadow: 0 0 0 0 rgba(0,255,136, 0); }
}

/* JANELA FLUTUANTE */
#mod-menu {
  position: fixed;
  top: 90px;
  left: 20px;
  width: 330px;
  max-height: 80vh;
  background: var(--panel);
  border: 2px solid var(--green);
  border-radius: 14px;
  box-shadow: 0 8px 30px rgba(0,0,0,0.8);
  z-index: 9998;
  display: flex;
  flex-direction: column;
  overflow: hidden;
  backdrop-filter: blur(10px);
}

.menu-header {
  background: #082418;
  padding: 10px 14px;
  display: flex;
  align-items: center;
  justify-content: space-between;
  border-bottom: 1px solid var(--border);
  cursor: move;
}

.menu-title {
  color: var(--green);
  font-size: 12px;
  font-weight: 900;
  letter-spacing: 2px;
}

.menu-close {
  background: transparent;
  border: none;
  color: #ff7185;
  font-size: 14px;
  font-weight: bold;
  cursor: pointer;
}

.menu-body {
  padding: 12px;
  overflow-y: auto;
  max-height: calc(80vh - 45px);
}

.menu-body::-webkit-scrollbar {
  width: 4px;
}
.menu-body::-webkit-scrollbar-thumb {
  background: var(--border);
  border-radius: 4px;
}

.section-title {
  font-size: 10px;
  color: #8fa99b;
  margin: 8px 0 6px;
  letter-spacing: 1px;
  text-transform: uppercase;
  font-weight: bold;
}

.grid-mod {
  display: grid;
  grid-template-columns: 1fr;
  gap: 6px;
  margin-bottom: 8px;
}

button.mod-btn {
  width: 100%;
  border: 1px solid #176b49;
  background: #08150f;
  color: #a6c6b5;
  border-radius: 6px;
  padding: 10px 8px;
  font-size: 10px;
  font-weight: bold;
  cursor: pointer;
  text-transform: uppercase;
  transition: 0.1s;
  text-align: left;
  display: flex;
  justify-content: space-between;
  align-items: center;
}

button.mod-btn::after {
  content: "OFF";
  color: #ff2448;
  font-size: 9px;
  background: rgba(255,36,72,0.1);
  padding: 2px 5px;
  border-radius: 4px;
}

button.mod-btn.active {
  background: #063d27;
  border-color: var(--green);
  color: #fff;
  box-shadow: 0 0 8px var(--green-glow);
}

button.mod-btn.active::after {
  content: "ON";
  color: var(--green);
  background: rgba(0,255,136,0.15);
}

button.launch-btn {
  background: var(--green);
  color: #00170c;
  border: none;
  font-weight: 900;
  text-align: center;
  justify-content: center;
  padding: 12px;
  font-size: 11px;
  border-radius: 6px;
  cursor: pointer;
  margin-bottom: 6px;
  width: 100%;
}

button.launch-btn::after { display: none; }

label.slider-label {
  display: block;
  color: #a6c6b5;
  font-size: 9px;
  margin: 6px 0 2px;
  font-weight: bold;
}

input[type="range"] {
  width: 100%;
  accent-color: var(--green);
  height: 4px;
  cursor: pointer;
}

.val-txt {
  float: right;
  color: var(--green);
  font-family: monospace;
}

.bg-fallback {
  display: flex;
  flex-direction: column;
  align-items: center;
  justify-content: center;
  height: 100vh;
  text-align: center;
  padding: 20px;
}

.bg-fallback h1 {
  color: var(--green);
  font-size: 22px;
  text-shadow: 0 0 10px var(--green);
  margin-bottom: 5px;
}

.bg-fallback p {
  color: #8fa99b;
  font-size: 12px;
  margin-bottom: 20px;
}

#toast {
  position: fixed;
  left: 50%;
  bottom: 20px;
  transform: translateX(-50%);
  background: #092416;
  border: 1px solid var(--green);
  color: var(--green);
  padding: 8px 14px;
  border-radius: 6px;
  display: none;
  z-index: 10000;
  font-size: 10px;
  font-weight: bold;
  box-shadow: 0 4px 15px rgba(0,0,0,0.6);
}
</style>
</head>

<body>
<canvas id="matrix"></canvas>

<div class="bg-fallback">
  <h1>NUNEZ PRO MOD MENU</h1>
  <p>Toque no ícone flutuante verde (NZ) para abrir as opções.</p>
  <button class="launch-btn" id="openFFMain" style="max-width: 250px;">🚀 ABRIR FREE FIRE AGORA</button>
</div>

<!-- ÍCONE FLUTUANTE -->
<div id="floating-icon">NZ</div>

<!-- PAINEL FLUTUANTE -->
<div id="mod-menu">
  <div class="menu-header" id="menuHeader">
    <span class="menu-title">⚡ NUNEZ MOD v4.5</span>
    <button class="menu-close" id="closeMenu">✕</button>
  </div>
  
  <div class="menu-body">
    <div class="grid-mod">
      <button class="launch-btn" id="openFFFloat">🚀 ENTRAR NO FREE FIRE</button>
    </div>

    <div class="section-title">Funções de Combate (Aimbot)</div>
    <div class="grid-mod">
      <button class="mod-btn">Aimbot Cabeça</button>
      <button class="mod-btn">Aimlock Suave</button>
      <button class="mod-btn">Mira Leve 360</button>
      <button class="mod-btn">Headtrick Pro</button>
    </div>

    <div class="section-title">Funções Visuais (ESP)</div>
    <div class="grid-mod">
      <button class="mod-btn">ESP Box Player</button>
      <button class="mod-btn">ESP Linha / Distância</button>
      <button class="mod-btn">ESP Nome & Vida</button>
    </div>

    <div class="section-title">Otimizações & Sistema</div>
    <div class="grid-mod">
      <button class="mod-btn">Ultra Touch 120Hz</button>
      <button class="mod-btn">Anti-Lag / Ping Fix</button>
      <button class="mod-btn">Bypass Inteligente</button>
    </div>

    <div class="section-title">Ajuste de Mira</div>
    <label class="slider-label">FOV VISUAL <span class="val-txt" id="fovVal">90</span></label>
    <input type="range" id="fovRange" min="30" max="180" value="90">

    <label class="slider-label">SUAVIDADE <span class="val-txt" id="smoothVal">50</span></label>
    <input type="range" id="smoothRange" min="1" max="100" value="50">
  </div>
</div>

<div id="toast"></div>

<script>
const $ = id => document.getElementById(id);

function notify(msg) {
  const t = $("toast");
  t.textContent = msg;
  t.style.display = "block";
  clearTimeout(t.timer);
  t.timer = setTimeout(() => t.style.display = "none", 2000);
}

let menuVisible = true;
$("floating-icon").addEventListener("click", () => {
  menuVisible = !menuVisible;
  $("mod-menu").style.display = menuVisible ? "flex" : "none";
});

$("closeMenu").addEventListener("click", () => {
  $("mod-menu").style.display = "none";
  menuVisible = false;
  notify("Menu minimizado. Toque no ícone NZ.");
});

document.querySelectorAll(".mod-btn").forEach(btn => {
  btn.addEventListener("click", () => {
    btn.classList.toggle("active");
    const status = btn.classList.contains("active") ? "ATIVADO" : "DESATIVADO";
    const name = btn.childNodes[0].nodeValue.trim();
    notify(name + " — " + status);
  });
});

$("fovRange").addEventListener("input", e => $("fovVal").textContent = e.target.value);
$("smoothRange").addEventListener("input", e => $("smoothVal").textContent = e.target.value);

function launchFreeFire() {
  notify("A ABRIR O FREE FIRE...");
  const intentUrl = "intent://launch/#Intent;package=com.dts.freefireth;action=android.intent.action.MAIN;category=android.intent.category.LAUNCHER;end;";
  window.location.href = intentUrl;
}

$("openFFMain").addEventListener("click", launchFreeFire);
$("openFFFloat").addEventListener("click", launchFreeFire);

/* MATRIX BACKGROUND */
const canvas = $("matrix");
const ctx = canvas.getContext("2d");
let drops = [];
function resizeMatrix() {
  canvas.width = window.innerWidth;
  canvas.height = window.innerHeight;
  drops = Array(Math.ceil(canvas.width / 12)).fill(1);
}
window.addEventListener("resize", resizeMatrix);
resizeMatrix();
setInterval(() => {
  ctx.fillStyle = "rgba(3,5,7,0.1)";
  ctx.fillRect(0, 0, canvas.width, canvas.height);
  ctx.fillStyle = "#00ff88";
  ctx.font = "11px monospace";
  for (let i = 0; i < drops.length; i++) {
    ctx.fillText(Math.random() > 0.5 ? "1" : "0", i * 12, drops[i] * 12);
    if (drops[i] * 12 > canvas.height && Math.random() > 0.98) drops[i] = 0;
    drops[i]++;
  }
}, 50);

/* MOVER JANELA FLUTUANTE */
const menu = $("mod-menu");
const header = $("menuHeader");
let isDragging = false, startX, startY, initialX, initialY;

header.addEventListener("touchstart", e => {
  isDragging = true;
  startX = e.touches[0].clientX;
  startY = e.touches[0].clientY;
  initialX = menu.offsetLeft;
  initialY = menu.offsetTop;
});

document.addEventListener("touchmove", e => {
  if (!isDragging) return;
  const dx = e.touches[0].clientX - startX;
  const dy = e.touches[0].clientY - startY;
  menu.style.left = (initialX + dx) + "px";
  menu.style.top = (initialY + dy) + "px";
});

document.addEventListener("touchend", () => isDragging = false);
</script>
</body>
</html>
